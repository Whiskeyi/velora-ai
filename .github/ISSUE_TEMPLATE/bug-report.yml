name: Bug report
description: Report a reproducible runtime or component defect.
body:
  - type: input
    id: version
    attributes:
      label: Velora version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include code or a small repository without private data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, React version, framework, and transport.
