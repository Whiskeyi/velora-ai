<!doctype html>
<html lang="en" data-showcase-theme="dark" data-velora-demo-transport="mock">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#070a10" />
    <script>
      (() => {
        const requested = new URLSearchParams(location.search).get("theme");
        let saved = null;
        try {
          saved = localStorage.getItem("velora-theme-preference");
        } catch {}
        const theme =
          requested === "light" || requested === "dark"
            ? requested
            : saved === "light" || saved === "dark"
              ? saved
              : matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
        document.documentElement.dataset.showcaseTheme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content =
          theme === "light" ? "#eef2f8" : "#05070b";
      })();
    </script>
    <meta
      name="description"
      content="Velora AI is a streaming-first React component system for agentic interfaces."
    />
    <meta property="og:title" content="Velora AI Components" />
    <meta
      property="og:description"
      content="Production-minded React primitives for streaming, reasoning, tools, and conversation workflows."
    />
    <meta property="og:image" content="./og.png" />
    <title>Velora AI Components</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
